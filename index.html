<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManagement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>TaskManagement</h1>
  </header>

  <main class="board">
    <section class="list">
      <h2 class="list-title">未着手</h2>
      <div class="cards"></div>
      <form class="add-form">
        <input class="add-input" type="text" placeholder="タスクのタイトル">
        <p class="add-error">タイトルを入力してください</p>
        <button class="add-button" type="submit">カードを追加</button>
      </form>
    </section>

    <section class="list">
      <h2 class="list-title">作業中</h2>
      <div class="cards"></div>
      <form class="add-form">
        <input class="add-input" type="text" placeholder="タスクのタイトル">
        <p class="add-error">タイトルを入力してください</p>
        <button class="add-button" type="submit">カードを追加</button>
      </form>
    </section>

    <section class="list">
      <h2 class="list-title">完了</h2>
      <div class="cards"></div>
      <form class="add-form">
        <input class="add-input" type="text" placeholder="タスクのタイトル">
        <p class="add-error">タイトルを入力してください</p>
        <button class="add-button" type="submit">カードを追加</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
