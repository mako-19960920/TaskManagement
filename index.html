<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManagement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>TaskManagement</h1>
  </header>

  <main class="board">
    <section class="list">
      <h2 class="list-title">未着手</h2>
      <div class="cards">
        <div class="card">企画書を書く</div>
        <div class="card">資料を集める</div>
      </div>
    </section>

    <section class="list">
      <h2 class="list-title">作業中</h2>
      <div class="cards">
        <div class="card">画面を作る</div>
      </div>
    </section>

    <section class="list">
      <h2 class="list-title">完了</h2>
      <div class="cards"></div>
    </section>
  </main>
</body>
</html>
