name: PR の規約

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  issue-link:
    name: Issue 参照
    runs-on: ubuntu-latest
    steps:
      - name: ブランチ名と Issue 番号を確認する
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! printf '%s\n' "$HEAD" | grep -Eq '^[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "ブランチ名は {Issue番号}-{短い英語} にしてください。例: 12-add-due-date"
            exit 1
          fi
          number="$(printf '%s\n' "$HEAD" | sed -E 's/^([0-9]+)-.*/\1/')"
          if ! printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eq "(^|[^0-9])#${number}([^0-9]|$)"; then
            echo "Pull Request のタイトルか本文に #${number} を書いてください。閉じるときは Fixes #${number} です。"
            exit 1
          fi
