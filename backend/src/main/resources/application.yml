spring:
  application:
    name: taskmanagement
  # DB の接続先。環境変数（DB_URL・DB_USERNAME・DB_PASSWORD）があればそれを使い、無ければ : の後ろの値（開発用）を使う
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
    username: ${DB_USERNAME:taskboard}
    password: ${DB_PASSWORD:taskboard}
  jpa:
    open-in-view: false
    hibernate:
      # テーブルは Flyway が作る。Hibernate は Task クラスとテーブルが合っているかを確かめるだけ（合わなければ起動しない）
      ddl-auto: validate
  # テーブルの作成と変更（src/main/resources/db/migration の V1、V2 …）と、初期データ（afterMigrate.sql）
  flyway:
    # Flyway を入れる前からあるデータベース（テーブルはあるが、Flyway の記録が無い）は、「V1 まで済み」として扱う
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
